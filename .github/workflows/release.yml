name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # dry run: builds and signs, but only a tag publishes a release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      # Ad-hoc signature (no identity): Apple Silicon refuses unsigned code, and the linker only
      # signs arm64 on its own. It does not satisfy Gatekeeper; that needs a Developer ID + notarization.
      - name: Ad-hoc sign (macOS)
        if: contains(matrix.target, 'apple')
        run: |
          bin=target/${{ matrix.target }}/release/wormhole
          codesign --force --sign - "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          codesign --display --verbose=2 "$bin" 2>&1 | grep -E 'Identifier|Format|Signature'
      - name: Package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/wormhole dist/
          cd dist && tar czf ../wormhole-${{ matrix.name }}.tar.gz wormhole
          cd .. && shasum -a 256 wormhole-${{ matrix.name }}.tar.gz > wormhole-${{ matrix.name }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wormhole-${{ matrix.name }}
          path: wormhole-${{ matrix.name }}.tar.gz*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: wormhole-*
          generate_release_notes: true

  # Points penpapertech/homebrew-tap at this release. Needs the HOMEBREW_TAP_TOKEN secret: a
  # fine-grained token with Contents read/write on penpapertech/homebrew-tap only. Without it the
  # job only warns, and the formula can be updated by hand with scripts/homebrew-formula.sh.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Update the formula
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew formula was not updated."
            exit 0
          fi
          git clone -q "https://x-access-token:$TOKEN@github.com/penpapertech/homebrew-tap.git" tap
          scripts/homebrew-formula.sh "${TAG#v}" dist > tap/Formula/wormhole.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "Formula already up to date."; exit 0; fi
          git commit -qam "wormhole ${TAG#v}"
          git push -q origin HEAD
