name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: End-to-end (local mailbox)
        run: tests/local_e2e.sh target/release/wormhole
      - name: End-to-end (LAN discovery only)
        run: MAILBOX=off tests/local_e2e.sh target/release/wormhole

  nat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: NAT traversal (docker, simulated home routers)
        run: tests/nat/run.sh target/release/wormhole
